<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - PUMA</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fff; padding: 15px; margin: 0; text-align: center; }
        h2 { text-transform: uppercase; font-size: 18px; margin-bottom: 15px; border-bottom: 2px solid #ba2026; padding-bottom: 5px; }
        form { display: flex; flex-direction: column; gap: 10px; }
        input, select { padding: 10px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box; }
        button { padding: 10px; background: #ba2026; color: #fff; border: none; font-weight: bold; text-transform: uppercase; cursor: pointer; }
        button:hover { background: #8a161b; }
        a { display: block; margin-top: 10px; color: #000; font-size: 13px; text-decoration: none; font-weight: bold; }
        a:hover { color: #ba2026; }
    </style>
</head>
<body>

    <h2>Crear Cuenta</h2>
    <form action="registro.php" method="POST">
        <input type="text" name="nombre" placeholder="Nombre completo" required>
        <input type="email" name="email" placeholder="Correo electrónico" required>
        <input type="password" name="password" placeholder="Contraseña" required>
        <input type="tel" name="telefono" placeholder="Teléfono" required>
        <input type="date" name="fecha_nacimiento" required>
        <select name="genero" required>
            <option value="">Selecciona Género</option>
            <option value="Masculino">Masculino</option>
            <option value="Femenino">Femenino</option>
            <option value="Otro">Otro</option>
        </select>
        <button type="submit">Registrarse</button>
    </form>

    <a href="index.html" target="_top">Volver a Inicio</a>

</body>
</html>
